[project]
name = "kkachi-nogeumgi"
version = "1.0.11"
description = "맥에서 로컬로 돌아가는 녹음·전사·화자 구분 앱"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.2",
    "imageio-ffmpeg>=0.6.0",
    "mcp>=1.12,<2",
    "mlx-audio==0.5.7",
    "pillow>=11",
    "pyobjc-framework-Vision>=11",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "soynlp>=0.0.493",
    "uvicorn[standard]>=0.54.0",
    "yt-dlp>=2025.1.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

# 시험판 때 Claude 앱 설정에 넣은 '--group video' 가 깨지지 않게 이름만 남겨 둔다
video = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::SyntaxWarning"]
