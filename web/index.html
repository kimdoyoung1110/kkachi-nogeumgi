<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>까치녹음기</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">🐦‍⬛</span>
      <span class="brand-name">까치녹음기</span>
    </a>
    <form class="search" role="search" id="search-form">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input type="search" id="search-input" placeholder="모든 녹음에서 찾기" aria-label="모든 녹음에서 찾기" autocomplete="off">
    </form>
    <nav class="topbar-actions">
      <button class="btn btn-ghost btn-record" id="btn-record"><span class="rec-dot"></span>녹음하기</button>
      <button class="btn btn-primary" id="btn-upload">파일 올리기</button>
      <button class="icon-btn icon-btn-lg" id="btn-settings" aria-label="설정" title="설정">⚙</button>
    </nav>
  </header>

  <div class="banner" id="offline-banner" hidden>
    앱과 연결이 끊겼어요. Dock의 <b>까치녹음기</b>를 눌러 다시 켜주세요. 켜지면 저절로 이어져요.
  </div>

  <main id="view" class="container" aria-live="polite"></main>

  <input type="file" id="file-input" accept="audio/*,video/*,.m4a,.mp3,.wav,.webm,.mp4,.aac,.ogg,.flac" hidden>

  <div class="drop-overlay" id="drop-overlay" hidden>
    <div class="drop-overlay-inner">여기에 놓으면 올라가요</div>
  </div>

  <div class="toast-stack" id="toasts" role="status"></div>

  <div class="overlay" id="overlay" hidden>
    <div class="overlay-card">
      <div class="overlay-icon" id="overlay-icon"></div>
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
    </div>
  </div>

  <dialog id="guide-dialog" class="dialog guide">
    <div class="guide-steps" id="guide-steps"></div>
    <div class="guide-dots" id="guide-dots"></div>
    <div class="dialog-actions">
      <button type="button" class="btn btn-ghost" id="guide-prev">이전</button>
      <button type="button" class="btn btn-primary" id="guide-next">다음</button>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="dialog">
    <form method="dialog">
      <div id="confirm-text" class="confirm-text"></div>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" id="confirm-cancel">취소</button>
        <button type="button" class="btn btn-danger" id="confirm-ok">삭제</button>
      </div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
